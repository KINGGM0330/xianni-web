<style>

.art{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px 26px;max-width:840px;margin:0 auto}

.backbtn{display:inline-block;cursor:pointer;padding:8px 16px;margin-bottom:16px;border-radius:10px;background:var(--panel);border:1px solid var(--line2);color:var(--gold2);font-size:13px;font-weight:700}
.set-sec{background:linear-gradient(180deg,rgba(30,24,50,.55),rgba(16,13,28,.55));border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden;max-width:840px}
.set-sec-t{background:linear-gradient(90deg,rgba(231,196,106,.16),transparent);color:var(--gold2);font-weight:800;font-size:14px;padding:10px 16px;border-bottom:1px solid var(--line);letter-spacing:1px}
.set-sec-t::before{content:'▎';color:var(--pur);margin-right:6px}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid rgba(255,255,255,.045)}

.foot{text-align:center;color:var(--mut);font-size:12px;padding:26px 0 0;border-top:1px solid var(--line);margin-top:30px;line-height:1.9}
.fab{position:fixed;right:18px;bottom:18px;z-index:70;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 40% 35%,var(--gold2),var(--gdim));color:#231a06;font-size:22px;cursor:pointer;box-shadow:0 6px 24px rgba(231,196,106,.45)}
@media(max-width:900px){.nav-links{position:fixed;top:59px;right:0;width:230px;height:calc(100vh - 59px);flex-direction:column;align-items:stretch;justify-content:flex-start;gap:2px;padding:12px;background:rgba(10,8,18,.98);border-left:1px solid var(--line2);transform:translateX(100%);transition:.25s;overflow-y:auto}.nav-links.open{transform:none}.nav-links a{padding:12px 14px}.burger{display:block}.content{padding:16px 14px 60px}.hero{margin:-16px -14px 6px}}
</style></head><body>

<script>(function(){
const DB=window.DB, app=document.getElementById('app');
const el=id=>document.getElementById(id);
const ic=id=>{const g=window.ICON&&window.ICON[id];return g?`<img src="assets/icons/${g}.png" loading="lazy" style="width:34px;height:34px;object-fit:contain;image-rendering:pixelated;flex:none" onerror="this.style.display='none'">`:'';};
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
/* 搜尋正規化：全形→半形、去空白、轉小寫。
   道具原名用的是半形括號「精靈水晶(生命的祝福)」，但中文輸入法預設打出來
   是全形「（）」，直接 indexOf 會完全比不到 —— 玩家就以為官網沒這筆資料。 */
const nm=s=>String(s==null?'':s).replace(/[\uFF01-\uFF5E]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[\u3000\s]/g,'').toLowerCase();
const hit=(h,q)=>nm(h).indexOf(nm(q))>=0;
const clean=s=>String(s==null?'':s).replace(/\\f=?/gi,'').replace(/\\a./gi,'').replace(/\\[0-9%]/g,'').trim();
const TYPE={singlebow:'單手弓',sword:'劍',claw:'爪',chainsword:'鎖鏈劍',kiringku:'起麟穿甲',staff:'法杖',edoryu:'刀',tohandsword:'雙手劍',bow:'弓',singlespear:'單手長矛',tohandblunt:'雙手鈍器',dagger:'匕首',spear:'長矛',gauntlet:'拳套',tohandstaff:'雙手法杖',blunt:'鈍器',boots:'靴子',helm:'頭盔',cloak:'斗篷',T:'內衣',pants:'褲子',armor:'鎧甲',amulet:'項鍊',ring:'戒指',glove:'手套',belt:'腰帶',shield:'盾牌',earring:'耳環',guarder:'護腕',shoulder:'肩甲',badge:'徽章',talisman:'符咒',talisman2:'符咒二',talisman3:'符咒三',runeword_left:'符文(左)',runeword_middle:'符文(中)',runeword_right:'符文(右)'};
try{DB.weapon.sort((a,b)=>a.id-b.id);DB.armor.sort((a,b)=>a.id-b.id);}catch(e){}

/* 背景粒子 */
(function(){const c=el('fx'),x=c.getContext('2d');let w,h,ps;
 function rs(){w=c.width=innerWidth;h=c.height=innerHeight;}rs();addEventListener('resize',rs);
 ps=Array.from({length:70},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.8+.4,s:Math.random()*.4+.08,o:Math.random()*.5+.2,h:Math.random()<.5?'231,196,106':'165,130,255'}));
 (function loop(){x.clearRect(0,0,w,h);for(const p of ps){p.y-=p.s;p.x+=Math.sin(p.y*.01)*.15;if(p.y<-5){p.y=h+5;p.x=Math.random()*w;}x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fillStyle='rgba('+p.h+','+p.o+')';x.shadowBlur=8;x.shadowColor='rgba('+p.h+',.8)';x.fill();}requestAnimationFrame(loop);})();})();

function chips(s){const keys=Object.keys(s||{});if(!keys.length)return '<span style="color:var(--mut);font-size:11px">—</span>';
 return '<div class="chips">'+keys.map(k=>{const v=s[k];const cls=(typeof v==='number'&&v<0)?'neg':'pos';return '<span class="chip '+cls+'">'+esc(k)+'<b>'+(v>0?'+':'')+v+'</b></span>';}).join('')+'</div>';}
function jobs(arr){if(!arr||!arr.length)return '<span style="color:var(--mut);font-size:11px">全職</span>';if(arr.length>=8)return '<span class="job">全職業</span>';return '<div class="jobs">'+arr.map(j=>'<span class="job">'+esc(j)+'</span>').join('')+'</div>';}

let heroRAF=null;
function initHeroFx(){if(heroRAF)cancelAnimationFrame(heroRAF);const c=document.querySelector('.hero-fx');if(!c)return;const x=c.getContext('2d');let w=0,h=0;
 function rs(){const r=c.getBoundingClientRect();w=c.width=Math.max(1,r.width|0);h=c.height=Math.max(1,r.height|0);}rs();
 const COL=['231,196,106','150,200,255','185,150,255','120,240,220'];
 const motes=Array.from({length:48},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*2+.6,s:Math.random()*.5+.15,dr:Math.random()*.6-.3,ph:Math.random()*6.28,tw:Math.random()*.045+.012,c:COL[(Math.random()*COL.length)|0],o:Math.random()*.5+.3}));
 const pet=Array.from({length:16},()=>({x:Math.random()*w,y:Math.random()*h,vy:Math.random()*.5+.22,vx:Math.random()*.5-.25,rot:Math.random()*6.28,vr:(Math.random()*.02-.01),sz:Math.random()*7+5,o:Math.random()*.4+.22}));
 let t=0;function loop(){t++;x.clearRect(0,0,w,h);
  for(const m of motes){m.y-=m.s;m.x+=Math.sin(t*.01+m.ph)*.3+m.dr;if(m.y<-6){m.y=h+6;m.x=Math.random()*w;}if(m.x<-10)m.x=w+10;if(m.x>w+10)m.x=-10;const a=m.o*(0.55+0.45*Math.sin(t*m.tw+m.ph));x.beginPath();x.arc(m.x,m.y,m.r,0,6.29);x.fillStyle='rgba('+m.c+','+a.toFixed(3)+')';x.shadowBlur=10;x.shadowColor='rgba('+m.c+',.9)';x.fill();}
  x.shadowBlur=0;for(const p of pet){p.y+=p.vy;p.x+=p.vx+Math.sin(p.y*.02)*.3;p.rot+=p.vr;if(p.y>h+12){p.y=-12;p.x=Math.random()*w;}x.save();x.translate(p.x,p.y);x.rotate(p.rot);x.fillStyle='rgba(255,190,225,'+p.o+')';x.beginPath();x.ellipse(0,0,p.sz,p.sz*.48,0,0,6.29);x.fill();x.restore();}

let rankTab='level';
const RK_CAT=[['transform','變身'],['doll','娃娃'],['holy','聖物'],['achieve','成就'],['boss','BOSS']];
function rkMedal(i){return i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);}
function rkName(r){return `<span class="nm">${esc(r.n)}</span>`+(r.g?` <span class="idc">${esc(r.g)}</span>`:'');}
function rkNum(v){return String(v).replace(/\B(?=(\d{3})+(?!\d))/g,',');}
function rankRows(){
  const D=window.RANK;
  if(rankTab==='level'){
    return `<table class="tbl"><thead><tr><th>#</th><th>角色</th><th>職業</th><th>轉生</th><th>等級</th><th>經驗</th></tr></thead><tbody>`
      + D.level.map((r,i)=>`<tr><td>${rkMedal(i)}</td><td>${rkName(r)}</td><td>${esc(r.c)}</td><td>${r.mt?('+'+r.mt):'—'}</td><td><b>${r.lv}</b></td><td class="idc">${rkNum(r.ex)}</td></tr>`).join('')
      + `</tbody></table>`;
  }
  if(rankTab==='collect'){
    return `<table class="tbl"><thead><tr><th>#</th><th>角色</th><th>職業</th>`
      + RK_CAT.map(c=>`<th>${c[1]}</th>`).join('')
      + `<th>合計</th><th>完成度</th></tr></thead><tbody>`
      + D.collect.map((r,i)=>`<tr><td>${rkMedal(i)}</td><td>${rkName(r)}</td><td>${esc(r.c)}</td>`
        + RK_CAT.map(c=>`<td class="idc">${r[c[0]]}/${D.cap[c[0]]}</td>`).join('')
        + `<td><b>${r.sum}</b>/${D.capsum}</td><td>${r.pct}%</td></tr>`).join('')
      + `</tbody></table>`;
  }
  return `<table class="tbl"><thead><tr><th>#</th><th>角色</th><th>職業</th><th>紋樣積分</th></tr></thead><tbody>`
    + D.pattern.map((r,i)=>`<tr><td>${rkMedal(i)}</td><td>${rkName(r)}</td><td>${esc(r.c)}</td><td><b>${rkNum(r.p)}</b></td></tr>`).join('')
    + `</tbody></table>`;
}
window.__rankGo=function(k){rankTab=k;const b=document.getElementById('rkbox');if(b)b.innerHTML=rankRows();
  document.querySelectorAll('#rktabs .plaque').forEach(x=>x.classList.toggle('on',x.dataset.rk===k));};
function rankView(){
  const D=window.RANK;
  if(!D) return `<div class="sec-head"><div><h1 class="title">排行榜</h1><div class="subtitle">資料還沒產生</div></div></div>`;
  const T=[['level','等級榜','轉生 → 等級 → 經驗'],['collect','收集榜','變身/娃娃/聖物/成就/BOSS'],['pattern','紋樣榜','紋樣積分']];
  return `<div class="sec-head"><div><h1 class="title">排行榜</h1><div class="subtitle">`
    + `統計 ${rkNum(D.total)} 位角色 ‧ 每榜取前 ${D.level.length} 名 ‧ 資料時間 ${esc(D.gen)}</div></div></div>`
    + `<div class="grid" id="rktabs" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">`
    + T.map(t=>`<div class="plaque${t[0]===rankTab?' on':''}" data-rk="${t[0]}" onclick="__rankGo('${t[0]}')"><div class="plaque-frame"><div class="plaque-inner"><div class="plaque-title">${t[1]}</div><div class="plaque-sub">${t[2]}</div></div></div></div>`).join('')
    + `</div><div class="tblwrap" id="rkbox">${rankRows()}</div>`
    + `<div class="idc" style="margin-top:6px">※ 排行為靜態快照，非即時；GM 帳號不列入。</div>`;
}
const R={rank:rankView,home,settings,event:eventView,upgrade:upgradeHub,jobset:jobsetView,upweapon:upWeaponView,upacc:upAccView,upbadge:upBadgeView,weapon:()=>equipView('weapon'),armor:()=>equipView('armor'),cards,gallery:galleryView,drop:dropView,promo:promoView,invite:inviteView,
 doll:()=>cardView('doll','娃娃系統','召喚娃娃並蒐集卡片累積能力'),transform:()=>cardView('transform','變身系統','變身取得外觀與能力，含時效'),holy:()=>cardView('holy','聖物系統','聖物提供防禦與特殊素質'),
 pattern:patternView,rebirth:rebirthView,prestige:prestigeView,more,rebskill:rebskillView,preshop:preshopView,clan:clanView,
 star:()=>listView('star'),bless:()=>listView('bless'),refine:()=>listView('refine'),color:()=>listView('color'),bosscol:()=>listView('bosscol'),achieve:()=>listView('achieve')};
window.__f=function(){if(cur==='weapon')equipRender('weapon');else if(cur==='armor')equipRender('armor');else if(cur==='doll')cardRender('doll');else if(cur==='transform')cardRender('transform');else if(cur==='holy')cardRender('holy');else if(cur==='gallery')galleryRender();else if(cur==='drop')dropRender();else if(cur==='pattern')patternRender();else if(LISTKEYS.indexOf(cur)>=0)listRender(cur);};
function go(s){if(!R[s])s='home';cur=s;if(s==='doll'||s==='transform'||s==='holy')cardTier='';app.innerHTML=R[s]();document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.s===s));
 if(s==='weapon')equipRender('weapon');if(s==='armor')equipRender('armor');if(s==='doll')cardRender('doll');if(s==='transform')cardRender('transform');if(s==='holy')cardRender('holy');if(s==='jobset')jobsetRender();if(s==='gallery')galleryRender();if(s==='drop')dropRender();if(s==='pattern')patternRender();if(LISTKEYS.indexOf(s)>=0)listRender(s);
 if(s==='home')initHeroFx();window.scrollTo(0,0);if(window.innerWidth<=900)closeNav();history.replaceState(null,'','#'+s);}
window.__go=go;
window.__tier=function(kind,t){cardTier=t;app.innerHTML=R[kind]();cardRender(kind);};
window.__art=function(kind,i){cur='article';let html='';
 if(kind==='news'){const n=(window.SITE_NEWS||NEWS_DEFAULT)[i]||['','','',''];html=`<div class="backbtn" onclick="__go('home')">← 返回首頁</div><div class="art"><div class="art-head"><div class="ann-badge2">${esc(n[1]||'')}</div><h1 class="title">${esc(n[2]||'')}</h1><div class="subtitle">${esc(n[0]||'')}</div></div><div class="art-body">${n[3]||'<p>（此公告尚未填寫內文，可在 assets/news.js 為該則加上第 4 欄內文）</p>'}</div></div>`;}
 else if(kind==='setting'){html=`<div class="backbtn" onclick="__go('settings')">← 返回遊戲設定</div>`+renderSetting(SETTINGS[i]);}
 app.innerHTML=html;document.querySelectorAll('#nav a').forEach(a=>a.classList.remove('on'));window.scrollTo(0,0);if(window.innerWidth<=900)closeNav();};
document.getElementById('nav').addEventListener('click',e=>{const a=e.target.closest('a[data-s]');if(a)go(a.dataset.s);});
document.querySelector('.nav-brand').addEventListener('click',()=>go('home'));
app.addEventListener('click',e=>{const c=e.target.closest('[data-go]');if(c)go(c.dataset.go);});
window.toggleNav=function(){el('nav').classList.toggle('open');};
function closeNav(){el('nav').classList.remove('open');}
(function(){var d=document.getElementById('dl');if(d)d.href=(window.DOWNLOAD_URL||'#');})();
go((location.hash||'#home').slice(1));
})();
</script></body></html>
